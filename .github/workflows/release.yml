name: Build and publish Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'source/**'
      - '*.ps1'
      - '*.cs'
      - '*.html'
      - 'licenses/**'
      - 'scripts/**'
      - '.gitattributes'
      - '.github/workflows/release.yml'
      - 'docs/RELEASE_NOTES.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v1.5.6
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v1.5.6
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare pinned offline OCR data
        shell: powershell
        run: ./scripts/prepare-ocr.ps1
      - name: Verify scoring and cleanup plans
        shell: pwsh
        run: |
          node scripts/test-engine.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Scoring tests failed' }
          node scripts/test-import-main.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Main stat regression failed' }
          node scripts/test-upgrade-flow.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Enhancement policy tests failed' }
          node scripts/test-upgrade-scoring.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Live enhancement scoring tests failed' }
          node scripts/test-background.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Bundled background tests failed' }
          node scripts/test-roll-budget.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Aggregate relic roll budget regressions failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-live-adversarial.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Malformed observation and binding regressions failed' }
          node scripts/test-numeric-ocr-recovery.cjs
          if ($LASTEXITCODE -ne 0) { throw 'OCR crash/timeout/cancellation recovery failed' }
          node scripts/test-stress-bridge.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Persistent scorer UTF-8 protocol regression failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-roster-core.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Roster parser regression failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-roster-native.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Roster geometry regression failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-roster-bridge.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Roster API and ownership regression failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-roster-traversal.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Roster traversal regression failed' }
          node scripts/live-fixture-bridge.cjs --generate
          if ($LASTEXITCODE -ne 0) { throw 'Owned scoring fixtures failed' }
          node scripts/test-universal-speed.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Universal high-speed protection failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-universal-speed.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native universal high-speed protection failed' }
          node scripts/test-roster-flow.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Owned-only scoring regression failed' }
          node scripts/test-live-flow.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Live screen scoring tests failed' }
          node scripts/test-ocr-assets.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Offline OCR assets failed verification' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-live-core.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Live screen parser tests failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-live-pipeline.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Live end-to-end offline pipeline failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-live-executor.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Live worker function tests failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-live-bridge.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Live API tests failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-upgrade-core.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Enhancement executor tests failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-upgrade-bridge.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Enhancement bridge tests failed' }
          node scripts/test-mark-plan.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Plan tests failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-server.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Snapshot validation tests failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-appearance.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Appearance persistence tests failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-layout.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Layout tests failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-marker-core.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native matching tests failed' }
      - name: Verify complete 3000-item simulated inventory and repeated enhancements
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-live-bag.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Full simulated inventory test failed' }
      - name: Build single executable with verified official dependencies
        shell: powershell
        run: |
          node source/repack.mjs
          if ($LASTEXITCODE -ne 0) { throw 'UI packaging failed' }
          ./desktop/build.ps1
      - name: Publish experimental release
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --prerelease --title 'v1.5.6 · 账号五星识别与专属筛选（待游戏复测）' --notes-file docs/RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $env:RELEASE_TAG 'dist/hsr-relic-manager-v1.5.6-windows.zip' 'dist/hsr-relic-manager-v1.5.6.exe' 'dist/SHA256SUMS.txt' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed' }
          $assets = gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name'
          if ($assets -contains 'default.exe') {
            gh release delete-asset $env:RELEASE_TAG 'default.exe' --yes
            if ($LASTEXITCODE -ne 0) { throw 'Obsolete asset cleanup failed' }
          }
