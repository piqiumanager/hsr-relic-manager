      if(status==='discard'&&missing.length){status='review';reasons.push('账号中有未收录的五星角色，暂缓清理');}
      if(status==='discard'&&cfg.protectEquipped&&r.owner){status='review';reasons.push('低分但已装备，待你复核');}
      if(status==='discard'&&cfg.protectLocked&&r.locked){status='review';reasons.push('低分但已锁定，待你复核');}
      rows.push({...r,status,reasons,best,scores,qualifies:qualifies.map(s=>s.id),manual:null});
      if(i%45===0){onProgress(i/imported.relics.length);await new Promise(resolve=>setTimeout(resolve,0));}
    }
    if(cfg.reserve>0){
      const buckets=new Map();for(const row of rows)for(const s of row.scores){const k=[s.id,row.part,row.setId,row.main.stat].join('|');if(!buckets.has(k))buckets.set(k,[]);buckets.get(k).push({row,score:row.enhance===15?s.current:s.average});}
      for(const bucket of buckets.values()){bucket.sort((a,b)=>b.score-a.score);for(const {row}of bucket.slice(0,cfg.reserve))if(row.status==='discard'){row.status='review';row.reasons.push('触发自定义每组保留数量');}}
    }
    const diagnostics={total:rows.length,scored:rows.filter(r=>r.scores.length).length,unscored:rows.filter(r=>!r.scores.length).length,protected:rows.filter(r=>r.status==='review'&&r.scores.length).length,issues:{}};
    for(const r of rows.filter(r=>!r.scores.length))for(const issue of r.reasons)diagnostics.issues[issue]=(diagnostics.issues[issue]||0)+1;
    onProgress(1);return{rows,profileCount:profiles.length,missing,settings:cfg,diagnostics,at:new Date().toISOString()};
  }
  const status=r=>r.manual||r.status;
  function exportResults(result,imported){
    return {schema:'hsr-relic-decisions-v1',createdAt:result.at,source:imported.source,demo:!!imported.isDemo,settings:result.settings,targetCount:result.profileCount,sourceSnapshot:imported.relics.map(r=>({id:r.id,index:r.index,setId:r.setId,part:r.part,enhance:r.enhance,main:r.main,substats:r.substats})),relics:result.rows.map(r=>({id:r.id,index:r.index,setId:r.setId,setName:r.setName,part:r.part,enhance:r.enhance,main:r.main,substats:r.substats,decision:status(r),automaticDecision:r.status,reason:r.reasons,best:r.best,owner:r.owner,locked:r.locked})),gameChangesApplied:false};
  }
  function demo(){
    let state=1907;const random=()=>{state=(state*1664525+1013904223)>>>0;return state/4294967296;};
    const relics=[];const ps=Object.values(D.profiles).filter(p=>['1308','1309','1310','1303','1407','1401','1301','1313'].includes(p.id));
    for(let i=0;i<112;i++){
      const p=ps[i%ps.length]||Object.values(D.profiles)[0],pt=Object.keys(PARTS)[i%6];
      const main=p.parts[pt][0];const good=C.SubStats.filter(s=>(p.stats[s]||0)>0&&s!==main).sort((a,b)=>p.stats[b]-p.stats[a]);
      const bad=C.SubStats.filter(s=>(p.stats[s]||0)===0&&s!==main);
      const quality=i%4;let chosen=quality===0?[...good,...bad]:quality===1?[good[0],good[1],...bad,...good]:[...bad,...good];
      chosen=[...new Set(chosen.filter(Boolean))].slice(0,4);
      const level=[0,3,6,9,12,15][Math.floor(random()*6)];if(level===0&&i%2)chosen=chosen.slice(0,3);
      const values=chosen.map(s=>({key:s,value:C.SubStatValues[s][5].high}));
      for(let u=0;u<Math.floor(level/3)-(chosen.length===3?1:0);u++){let j=quality===0?Math.floor(random()*Math.min(2,values.length)):Math.floor(random()*values.length);values[j].value+=C.SubStatValues[values[j].key][5].high;}
      const set=Object.values(D.sets).find(x=>p.sets.includes(x.en)&&((pt==='PlanarSphere'||pt==='LinkRope')===String(x.id).startsWith('3')))||D.sets['102'];
      relics.push({_uid:'demo-'+(i+1),set_id:set.id,slot:pt,rarity:5,level,mainstat:main,substats:values,lock:i%17===0,location:i%19===0?p.id:'',discard:false});
    }
    const imported=parse({source:'示例背包（非你的账号）',version:4,characters:ps.map(p=>({id:p.id})),relics});imported.isDemo=true;return imported;
  }
  function displayNumber(s,v){return ['HP','ATK','DEF','SPD'].includes(s)?Math.floor(v+1e-5):Math.floor(v*10+1e-5)/10;}
  function markerFingerprint(r){
    if(!r.part||!r.main||!Array.isArray(r.substats))return null;
    const subs=[...r.substats,...(r.previewSubstats||[])].map(s=>[s.stat,displayNumber(s.stat,s.value)]).sort((a,b)=>a[0].localeCompare(b[0]));
    return JSON.stringify([r.setId,r.part,r.enhance,r.main.stat,subs]);
  }
  function buildMarkPlan(result,imported){
    if(!result||!imported)throw Error('请先读取背包并完成筛选。');
    if(imported.isDemo)throw Error('示例背包不能用于游戏内标记。');
    if(!imported.captureId)throw Error('自动标记需要先用“一键读取背包”取得本次新快照。已有 JSON 仍可离线筛选。');
    const grouped=new Map();
    for(const r of result.rows){const key=markerFingerprint(r);if(!grouped.has(key))grouped.set(key,[]);grouped.get(key).push(r);}
    // Include lower-star and otherwise skipped raw records to reject visual collisions.
    const otherKeys=new Set(list(imported.root.relics).filter(raw=>number(raw?.rarity??raw?.grade)!==5).filter(raw=>raw&&typeof raw==='object').map((raw,i)=>markerFingerprint(normalize(raw,i))));
    const candidates=[],skips={protected:0,alreadyDiscarded:0,unknownState:0,ambiguous:0,missingName:0};
    for(const [key,group]of grouped){
      const wanted=group.filter(r=>status(r)==='discard'&&r.status==='discard'&&!r.manual);
      if(!wanted.length)continue;
      const r=wanted[0];
      if(otherKeys.has(key)||group.some(x=>status(x)!=='discard'||x.status!=='discard'||x.manual||x.issues.length||x.locked!==false||x.owner!=='')){skips.protected+=wanted.length;continue;}
      if(group.some(x=>x.discarded===null)){skips.unknownState+=wanted.length;continue;}
      const unmarked=group.filter(x=>x.discarded===false);skips.alreadyDiscarded+=group.length-unmarked.length;
      if(!unmarked.length)continue;
      const pieceName=D.pieceNames?.[r.setId]?.[r.part];if(!pieceName){skips.missingName+=unmarked.length;continue;}
      candidates.push({key,ids:unmarked.map(x=>x.id),count:unmarked.length,setId:r.setId,setName:r.setName,pieceName,part:r.part,enhance:r.enhance,main:r.main,substats:r.substats,visualSubstats:[...r.substats,...r.previewSubstats]});
    }
    if(!candidates.length)throw Error('没有可自动标记的候选：已锁定、已装备、状态不明或已弃置的遗器不会再次点击。');
    return {schema:'hsr-marker-plan-v1',captureId:imported.captureId,createdAt:new Date().toISOString(),candidates,inventoryCount:list(imported.root.relics).length,total:candidates.reduce((n,x)=>n+x.count,0),skips,allowSalvage:false};
  }
  return{PARTS,STAT_ZH,PRESETS,DEFAULTS,parse,analyze,evaluate,metadata,targets,status,exportResults,demo,settingsValid,markerFingerprint,buildMarkPlan};
})();
</script><script>(() => {
 'use strict';const E=RelicEngine,$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let imported=null,result=null,settings=structuredClone(E.DEFAULTS),busy=false,running=false,watching=false;
 try{const saved=JSON.parse(localStorage.getItem('hsr-relic-settings-v1')||'null');if(saved)settings=E.settingsValid({...settings,...saved});}catch{}
 const names={keep:'高分保留',upgrade:'高潜力胚子',discard:'低分候选',review:'受保护 / 数据异常'};
 function message(text,phase){$('status').textContent=text;if(phase)$('phase').textContent=phase;}
 async function api(route,body){if(!globalThis.LOCAL_CONFIG)throw Error('请通过 EXE 打开工具。离线页面可导入 JSON 查看评分。');const r=await fetch('/api/'+route,{method:body===undefined?'GET':'POST',headers:{'X-Relic-Token':LOCAL_CONFIG.token,'Content-Type':'application/json'},...(body===undefined?{}:{body:JSON.stringify(body)})});const data=await r.json();if(!r.ok||data.error)throw Error(data.error||'本机服务未响应');return data;}

 function controls(){$('captureBtn').disabled=busy||running;$('markBtn').disabled=busy||running||!plan();$('stopBtn').disabled=!running;for(const id of ['settingsBtn','importBtn','demoBtn'])$(id).disabled=busy||running;$('detailsBtn').disabled=!result||busy;}
 function render(){
  const rows=result?.rows||[],d=result?.diagnostics;const counts={keep:0,upgrade:0,discard:0,review:0};for(const r of rows)counts[E.status(r)]++;
  for(const [id,val]of Object.entries({total:result?rows.length:'—',scored:d?.scored??'—',kept:result?counts.keep+counts.upgrade:'—',low:result?counts.discard:'—'}))$(id).textContent=val;
  if(d){$('coverage').textContent=`受保护 ${d.protected} 件 · 无评分 ${d.unscored} 件${d.unscored?' · '+Object.entries(d.issues).map(([k,v])=>k+' '+v).join('；'):''}`;$('coverage').classList.toggle('warning',d.unscored>0);}
  $('rulesSummary').textContent=`${settings.scope==='owned'?'已拥有':'全部已收录'}五星 · 满级 ≥${settings.current}；胚子平均 ≥${settings.average}，且上限 ≥${settings.best}。`;controls();
 }
 async function analyze(){if(!imported)return;busy=true;controls();message('正在按五星角色评分…','正在评分');try{result=await E.analyze(imported,settings,p=>$('progress').value=p);render();}catch(e){result=null;throw e;}finally{busy=false;render();}}
 async function loadFile(file){if(!file)return;if(file.size>45*1024*1024)throw Error('文件请控制在 45 MB 内。');const next=E.parse(await file.text());if(next.session)throw Error('请导入原始背包 JSON。');imported=next;result=null;await analyze();message('已导入并完成评分。离线导入可查看明细；游戏内标记前请重新读取背包。','评分完成');}
 async function capture(){if(busy||running)return;busy=true;imported=null;result=null;render();message('请在登录界面等待，允许管理员授权后再点击进入游戏。','正在读取');$('progress').value=0;
  try{await api('capture/start',{});let complete=false;for(let n=0;n<200;n++){await new Promise(r=>setTimeout(r,1200));const s=await api('capture/status');message(s.message||'读取已启动，请点击进入游戏…');if(s.state==='failed')throw Error(s.message||'读取失败');if(s.state==='complete'){imported=E.parse(s.data);imported.captureId=s.captureId;await analyze();complete=true;break;}}if(!complete)throw Error('读取超时，请重新尝试。');const p=plan();message(p?`评分完成，${p.total} 件可标记。`:'评分完成，没有新的可自动标记候选。可在明细中查看保留和保护原因。','评分完成');return true;
  }catch(e){message(e.message,'读取失败');return false;}finally{busy=false;render();}}
 function drawMarker(s){running=['starting','running'].includes(s.state);message(s.message||'正在标记…',running?'正在操作游戏':({complete:'已完成',partial:'部分未识别',stopped:'已停止',failed:'标记失败'}[s.state]||'准备就绪'));if(s.scanned&&s.inventoryCount)$('progress').value=Math.min(1,s.scanned/s.inventoryCount);if(!running)$('progress').value=s.state==='complete'?1:0;controls();}
 async function watch(){if(watching)return;watching=true;try{for(;;){const s=await api('marker/status');drawMarker(s);if(!running)break;await new Promise(r=>setTimeout(r,1400));}}catch(e){running=false;message(e.message,'标记中断');controls();}finally{watching=false;}}
 async function mark(){const p=plan();if(!p||running||busy)return;running=true;controls();try{await api('marker/start',{plan:p,previewOnly:$('previewOnly').checked});message('正在检查分辨率、打开遗器背包。请勿操作鼠标，F8 停止。','正在连接游戏');watch();}catch(e){running=false;message(e.message,'无法开始');controls();}}
 function dialog(title,html){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=html;$('dialog').showModal();}
 function details(){if(!result)return;dialog('遗器评分明细',`<div class="detail-tools"><input id="detailSearch" placeholder="搜索套装、角色、结果或原因"><button id="exportBtn">导出评分</button></div><p class="detail-summary">已评分 ${result.diagnostics.scored} / ${result.diagnostics.total} 件。受保护不等于没有评分。</p><div class="table-wrap"><table><thead><tr><th>遗器</th><th>适配五星</th><th>当前</th><th>平均潜力</th><th>上限</th><th>结果与原因</th></tr></thead><tbody id="detailRows"></tbody></table></div>`);
  const draw=()=>{const q=$('detailSearch').value.trim();$('detailRows').innerHTML=result.rows.filter(r=>!q||[r.setName,r.best?.name,names[E.status(r)],...r.reasons].join(' ').includes(q)).slice(0,3000).map(r=>`<tr><td>${esc(r.setName)}<small>${esc(E.PARTS[r.part])} +${r.enhance} · ${esc(E.STAT_ZH[r.main.stat]||r.main.stat)}</small></td><td>${esc(r.best?.name||'数据异常')}</td>${['current','average','best'].map(k=>'<td>'+(Number.isFinite(r.best?.[k])?r.best[k].toFixed(1):'—')+'</td>').join('')}<td>${esc(names[E.status(r)])}<small>${r.reasons.map(esc).join('；')}</small></td></tr>`).join('');};$('detailSearch').oninput=draw;draw();$('exportBtn').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(E.exportResults(result,imported),null,2)],{type:'application/json'}));a.href=url;a.download='遗器评分结果.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);};}

 $('captureBtn').onclick=capture;$('markBtn').onclick=mark;$('stopBtn').onclick=async()=>{try{message((await api('marker/stop',{})).message);}catch(e){message(e.message);}};
 $('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{try{await loadFile(e.target.files[0]);}catch(err){message(err.message,'导入失败');}finally{e.target.value='';}};

 globalThis.RelicDesk={get imported(){return imported;},get result(){return result;},get settings(){return settings;},loadFile,analyze,capture};globalThis.QuickFlow={start:capture};render();
 if(globalThis.LOCAL_CONFIG)(async()=>{try{const s=await api('marker/status');if(['running','starting'].includes(s.state)){drawMarker(s);watch();return;}const saved=await api('capture/latest');if(saved.data&&!imported&&!busy){imported=E.parse(saved.data);await analyze();message('已加载上次背包。标记前请重新读取。','上次背包');}}catch(e){message(e.message,'准备就绪');}})();
})();
