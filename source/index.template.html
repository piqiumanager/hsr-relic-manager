<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' blob:; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'"><title>绷铁遗器一键分解</title><style>/*STYLE*/</style></head><body>
<div class="app"><header><div class="star">✦</div><div><h1>绷铁遗器一键分解</h1><p>五星角色 · 极高分优先</p></div><button id="settingsBtn" class="quiet">评分设置</button></header>
<section class="task"><div class="task-title"><div><h2>遗器清理</h2><p>1920×1080 · PC 键鼠模式</p></div><span class="version">v1.3.0</span></div><div class="actions"><button id="captureBtn" class="primary">① 读取背包</button><button id="markBtn" class="primary" disabled>② 开始标记</button><button id="stopBtn" disabled>停止 · F8</button></div><div class="options"><label><input type="checkbox" id="previewOnly">仅识别预览</label><button id="importBtn" class="quiet">导入 JSON</button><input id="fileInput" type="file" accept=".json" hidden><button id="demoBtn" class="quiet" hidden>体验示例</button></div></section>
<section class="stats"><div><span>五星遗器</span><b id="total">—</b></div><div><span>已评分</span><b id="scored">—</b></div><div><span>高分 / 胚子保留</span><b id="kept">—</b></div><div><span>低分候选</span><b id="low">—</b></div></section>
<div id="coverage" class="coverage"></div>
<section class="progress"><div class="progress-head"><strong id="phase">准备就绪</strong><button id="detailsBtn" class="quiet" disabled>查看评分明细</button></div><progress id="progress" max="1" value="0"></progress><div id="status" role="status">就绪</div><small id="rulesSummary">满级 ≥75；胚子平均 ≥70，且上限 ≥85。任意目标五星达标即可保留。</small></section>
</div>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="关闭">×</button></div><div id="dialogBody"></div></dialog>
<script>/*DATA*/</script><script>/*CORE*/</script><script>/*ENGINE*/</script><script>/*APP*/</script></body></html>
