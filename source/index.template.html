<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' blob:; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'"><title>绷铁遗器一键分解</title><style>/*STYLE*/</style></head><body>
<img id="characterBackground" alt="" aria-hidden="true">
<div class="app"><header><div class="brand"><span class="star" aria-hidden="true">✦</span><h1>绷铁遗器一键分解</h1></div><span class="resolution">1920×1080 · 简体中文</span></header>
<nav class="navbar" aria-label="主导航"><span class="nav-current">遗器管理</span><button id="detailsBtn" disabled>评分明细</button><button id="settingsBtn">设置</button></nav>
<main class="workspace"><section class="task"><div class="task-title"><h2 id="taskTitle">遗器清理</h2><p>五星角色 · 极高分优先</p></div><select id="mode" aria-label="操作模式" hidden><option value="discard">弃置</option><option value="upgrade">强化</option></select><div class="task-list" aria-label="任务选择"><button id="discardModeBtn" class="task-item selected" aria-pressed="true">低分弃置</button><button id="upgradeModeBtn" class="task-item" aria-pressed="false">胚子强化</button></div><div class="options"><label><input type="checkbox" id="previewOnly">仅预览</label><button id="importBtn" class="quiet">导入 JSON</button><input id="fileInput" type="file" accept=".json" hidden><button id="demoBtn" class="quiet" hidden>体验示例</button></div><div class="actions"><button id="captureBtn">读取背包</button><button id="markBtn" class="primary" disabled>开始标记</button><button id="stopBtn" class="quiet" disabled>停止 · F8</button></div></section>
<section class="content"><section class="stats"><div><span>五星遗器</span><b id="total">—</b></div><div><span>已评分</span><b id="scored">—</b></div><div><span>高分 / 胚子</span><b id="kept">—</b></div><div><span>低分候选</span><b id="low">—</b></div></section><div id="coverage" class="coverage"></div><section class="progress"><div class="progress-head"><strong id="phase">准备就绪</strong></div><progress id="progress" max="1" value="0"></progress><div id="status" role="status">就绪</div><small id="rulesSummary">满级 ≥75；胚子平均 ≥70，且上限 ≥85。</small></section></section></main></div>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="关闭">×</button></div><div id="dialogBody"></div></dialog>
<script>/*DATA*/</script><script>/*CORE*/</script><script>/*ENGINE*/</script><script>/*APP*/</script></body></html>
